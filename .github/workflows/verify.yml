name: Verify and publish Magic Square

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magic-square-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 22 (no package cache)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax and tests
        run: |
          node --check square.js
          node --check app.js
          node --test
      - name: Headless Chromium UX audit
        run: node tests/browser-smoke.cjs

  publish:
    name: Deploy and verify live Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage only intended public files
        run: |
          mkdir -p dist/assets
          cp index.html styles.css square.js app.js .nojekyll dist/
          cp assets/solar-square-art.webp dist/assets/
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm deployed bytes and reject unintended public files
        shell: bash
        run: |
          set -euo pipefail
          site='https://luckygithub777.github.io/magic-square'
          matched=0
          for attempt in $(seq 1 28); do
            if curl --fail --silent --show-error --location --max-time 12 "${site}/index.html" -o /tmp/magic-square-live-index.html \
              && cmp --silent index.html /tmp/magic-square-live-index.html; then
              matched=1
              echo "Production HTML matches exact commit (attempt ${attempt})."
              break
            fi
            sleep 15
          done
          test "$matched" -eq 1 || { echo '::error::Production index does not match'; exit 1; }
          for file in styles.css square.js app.js assets/solar-square-art.webp; do
            curl --fail --silent --show-error --location --max-time 20 "${site}/${file}" -o "/tmp/magic-square-$(basename "$file")"
            cmp --silent "$file" "/tmp/magic-square-$(basename "$file")" || { echo "::error::Asset mismatch: ${file}"; exit 1; }
            echo "Verified live asset: ${file}"
          done
          for private_file in README.md tests/site.test.js .github/workflows/verify.yml; do
            status="$(curl --silent --show-error --location --max-time 12 -o /dev/null -w '%{http_code}' "${site}/${private_file}")"
            test "$status" != '200' || { echo "::error::Unexpected published source: ${private_file}"; exit 1; }
            echo "Not published: ${private_file} (HTTP ${status})"
          done
          echo "Production V&V passed: ${site}/"
