name: Verify Magic Square

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Source and static-site verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check square.js
          node --check app.js
      - name: Run complete test suite
        run: node --test


  pages-config:
    name: Identify configured GitHub Pages publishing source
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      build_type: ${{ steps.config.outputs.build_type }}
    steps:
      - name: Read Pages publishing mode
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cfg="$(curl --fail --silent --show-error --location --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          mode="$(jq -r '.build_type // "legacy"' <<< "$cfg")"
          echo "build_type=$mode" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages publishing mode: $mode"

  deploy-pages:
    name: Publish minimal static site when Actions-managed
    needs: [verify, pages-config]
    if: needs.pages-config.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site files only
        run: |
          mkdir -p dist/assets
          cp index.html styles.css square.js app.js .nojekyll dist/
          cp assets/solar-square-art.webp dist/assets/
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  production-smoke:
    name: Live GitHub Pages release verification
    needs: [verify, pages-config, deploy-pages]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.pages-config.result == 'success' && (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Verify live page matches this commit
        shell: bash
        run: |
          set -euo pipefail
          site="https://luckygithub777.github.io/magic-square"
          matched=0
          for attempt in $(seq 1 28); do
            if curl --fail --silent --show-error --location --max-time 12 "${site}/index.html" -o /tmp/magic-square-live-index.html \
              && cmp --silent index.html /tmp/magic-square-live-index.html; then
              matched=1
              echo "Production index.html matches this exact commit (attempt ${attempt})."
              break
            fi
            echo "Pages not yet serving this exact commit (attempt ${attempt}/28)."
            sleep 15
          done
          test "$matched" -eq 1 || { echo "::error::Production index did not match this commit"; exit 1; }
          for file in styles.css square.js app.js assets/solar-square-art.webp; do
            curl --fail --silent --show-error --location --max-time 20 "${site}/${file}" -o "/tmp/magic-square-$(basename "$file")"
            cmp --silent "$file" "/tmp/magic-square-$(basename "$file")" \
              || { echo "::error::Production asset differs from committed ${file}"; exit 1; }
            echo "Verified exact production asset: ${file}"
          done
          echo "Production release verified end-to-end: ${site}/"
